name: verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    # Dedicated native Windows runner: see docs/local-windows.md (CI).
    runs-on: [self-hosted, Windows, project1-local]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify with native PostgreSQL
        shell: powershell
        env:
          CATALOG_TEST_POSTGRES: ${{ secrets.CATALOG_TEST_POSTGRES }}
          ConnectionStrings__Catalog: ${{ secrets.CATALOG_CONNECTION_STRING }}
        run: ./scripts/verify.ps1 -System
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            artifacts/
            src/Web/test-results/
