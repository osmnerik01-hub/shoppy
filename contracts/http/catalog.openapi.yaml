{
  "openapi": "3.0.3",
  "info": {
    "title": "Catalog API",
    "version": "1.1.0",
    "description": "Read-only catalog. Products are validated by the domain and PostgreSQL constraints. Supported currencies: TRY, USD, EUR."
  },
  "paths": {
    "/products": {
      "get": {
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "pageSize",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "search",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          },
          {
            "name": "currency",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "TRY",
                "USD",
                "EUR"
              ]
            }
          },
          {
            "name": "minPrice",
            "in": "query",
            "required": false,
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 9999999999.99
            }
          },
          {
            "name": "maxPrice",
            "in": "query",
            "required": false,
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 9999999999.99
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "name",
                "name-desc",
                "price",
                "price-desc"
              ]
            }
          },
          {
            "name": "category",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100
            },
            "description": "Trimmed, case-insensitive exact match; combined with all other filters."
          },
          {
            "name": "brand",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100
            },
            "description": "Trimmed, case-insensitive exact match; combined with all other filters."
          }
        ],
        "description": "Filters precede pagination; totalCount is filtered. Default id order; other orders break ties by id. Price filters/sorts require currency. minPrice <= maxPrice. Literal case-insensitive name/description search (max 200 characters).",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProductPage"
                }
              }
            }
          },
          "400": {
            "description": "RFC 9457 problem response",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "RFC 9457 problem response",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/products/{id}": {
      "get": {
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Product"
                }
              }
            }
          },
          "400": {
            "description": "RFC 9457 problem response",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "RFC 9457 problem response",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "RFC 9457 problem response",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Product": {
        "type": "object",
        "required": [
          "id",
          "name",
          "description",
          "price",
          "currency",
          "category",
          "brand",
          "images",
          "specifications"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "description": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4000
          },
          "price": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true,
            "maximum": 9999999999.99,
            "multipleOf": 0.01
          },
          "currency": {
            "type": "string",
            "enum": [
              "TRY",
              "USD",
              "EUR"
            ]
          },
          "category": {
            "type": "string",
            "nullable": true,
            "minLength": 1,
            "maxLength": 100
          },
          "brand": {
            "type": "string",
            "nullable": true,
            "minLength": 1,
            "maxLength": 100
          },
          "images": {
            "type": "array",
            "maxItems": 20,
            "description": "Ascending unique position; empty for products without images.",
            "items": {
              "$ref": "#/components/schemas/ProductImage"
            }
          },
          "specifications": {
            "type": "array",
            "maxItems": 100,
            "description": "Unique names, case-insensitive.",
            "items": {
              "$ref": "#/components/schemas/ProductSpecification"
            }
          }
        }
      },
      "ProductPage": {
        "type": "object",
        "required": [
          "items",
          "page",
          "pageSize",
          "totalCount"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Product"
            }
          },
          "page": {
            "type": "integer"
          },
          "pageSize": {
            "type": "integer"
          },
          "totalCount": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "Problem": {
        "type": "object",
        "required": [
          "title",
          "status"
        ],
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string"
          }
        }
      },
      "ProductImage": {
        "type": "object",
        "required": [
          "url",
          "alt",
          "position"
        ],
        "properties": {
          "url": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://",
            "maxLength": 2048
          },
          "alt": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "position": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "ProductSpecification": {
        "type": "object",
        "required": [
          "name",
          "value"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          }
        }
      }
    }
  }
}
